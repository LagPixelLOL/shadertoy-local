[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shadertoy-local"
version = "0.1.0"
description = "Headless local Shadertoy runtime and shader test harness for agentic development"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "moderngl>=5.10",
    "numpy>=1.24",
    "pillow>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
shadertoy = "shadertoy_local.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shadertoy_local"]

[tool.pytest.ini_options]
testpaths = ["tests"]
