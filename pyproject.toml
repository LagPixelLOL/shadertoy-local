[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "shadertoy-local"
version = "0.1.0"
description = "Headless local Shadertoy runtime and shader test harness for agentic development"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "moderngl>=5.10",
    "numpy>=1.24",
    "pillow>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
shadertoy = "shadertoy_local.cli:main"

[tool.setuptools]
# The package lives in a flat src/ directory but installs (and imports) as
# `shadertoy_local`; a module importable as `src` would collide with every
# other project using the src layout.
packages = ["shadertoy_local"]
package-dir = { shadertoy_local = "src" }

[tool.pytest.ini_options]
testpaths = ["tests"]
